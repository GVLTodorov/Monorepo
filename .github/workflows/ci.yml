name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Monorepo.sln

      - name: Build
        run: dotnet build Monorepo.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >-
          dotnet test Monorepo.sln
          --configuration Release
          --no-build
          --nologo
          --verbosity minimal
          -p:ContinuousIntegrationBuild=true
          --collect:"XPlat Code Coverage"
          --logger trx
          --results-directory ./TestResults

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report
        run: reportgenerator -reports:"./TestResults/*/coverage.cobertura.xml" -targetdir:"./CoverageReport" -reporttypes:"Html;MarkdownSummaryGithub;Badges"

      - name: Add coverage summary to job summary
        run: cat ./CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ./CoverageReport/

      - name: Update coverage badges
        if: github.event_name == 'push'
        run: |
          mkdir -p .github/badges
          cp ./CoverageReport/badge_linecoverage.svg .github/badges/line_coverage.svg
          cp ./CoverageReport/badge_branchcoverage.svg .github/badges/branch_coverage.svg

      - name: Commit updated badges
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: update coverage badges [skip ci]"
          file_pattern: ".github/badges/*.svg"

  benchmarks:
    name: Run benchmarks
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Run MongoDB benchmarks
        run: dotnet run --project Mongo/Mongo.Benchmark/Mongo.Benchmark.csproj -c Release -- --filter "*"

      - name: Run PostgreSQL benchmarks
        run: dotnet run --project Postgres/Postgres.Benchmark/Postgres.Benchmark.csproj -c Release -- --filter "*"

      - name: Run SQLite benchmarks
        run: dotnet run --project Sqlite/Sqlite.Benchmark/Sqlite.Benchmark.csproj -c Release -- --filter "*"

      - name: Publish benchmark report to job summary
        shell: bash
        run: |
          {
            echo "# Benchmark results"
            echo
            echo "Runner: ubuntu-latest, commit ${{ github.sha }}"
            for assembly in Mongo.Benchmark Postgres.Benchmark Sqlite.Benchmark; do
              report="BenchmarkDotNet.Artifacts/results/$assembly.RepositoryBenchmarks-report-github.md"
              echo
              echo "## $assembly"
              echo
              if [[ -f "$report" ]]; then
                cat "$report"
              else
                echo "_No report found at $report_"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
